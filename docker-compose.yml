name: kafka-lab

x-broker-env: &broker-env
  KAFKA_PROCESS_ROLES: broker
  CLUSTER_ID: kafka-lab-cluster-0001
  KAFKA_CONTROLLER_QUORUM_VOTERS: 0@controller:9093
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_GROUP_MIN_SESSION_TIMEOUT_MS: 3000
  KAFKA_REPLICA_LAG_TIME_MAX_MS: 10000
  KAFKA_BROKER_HEARTBEAT_INTERVAL_MS: 1000
  KAFKA_NUM_PARTITIONS: 1

services:
  controller:
    image: apache/kafka:3.9.0
    container_name: kafka-lab-controller
    environment:
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: controller
      CLUSTER_ID: kafka-lab-cluster-0001
      KAFKA_LISTENERS: CONTROLLER://:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@controller:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT
      KAFKA_BROKER_SESSION_TIMEOUT_MS: 6000

  kafka-1:
    image: apache/kafka:3.9.0
    container_name: kafka-lab-1
    depends_on: [controller]
    ports: ["19092:19092"]
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:29092,EXTERNAL://localhost:19092

  kafka-2:
    image: apache/kafka:3.9.0
    container_name: kafka-lab-2
    depends_on: [controller]
    ports: ["19093:19093"]
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:19093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:29092,EXTERNAL://localhost:19093

  kafka-3:
    image: apache/kafka:3.9.0
    container_name: kafka-lab-3
    depends_on: [controller]
    ports: ["19094:19094"]
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:19094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:29092,EXTERNAL://localhost:19094

  postgres:
    image: postgres:16-alpine
    container_name: kafka-lab-postgres
    ports: ["15432:5432"]
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: kafka_lab

  redis:
    image: redis:7-alpine
    container_name: kafka-lab-redis
    ports: ["16379:6379"]

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-lab-ui
    depends_on: [kafka-1, kafka-2, kafka-3]
    ports: ["18080:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: kafka-lab
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
